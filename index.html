<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="it">
<head>
    <meta charset="utf-8">
    <title>INEDIA PROJECT: LSWF</title>
    <meta http-equiv="refresh" content="0; url=www.inedia.net84.net/index.html">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a3e;
            font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .loader {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .loader a {
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
        }
        .loader a:hover {
            text-decoration: underline;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #ffcc00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Benvenuto su <strong>INEDIA PROJECT</strong></p>
        <p style="font-size:14px; color:#aaa;">
            Se non vieni reindirizzato automaticamente, 
            <a href="www.inedia.net84.net/index.html">clicca qui</a>
        </p>
    </div>
</body>
</html>
